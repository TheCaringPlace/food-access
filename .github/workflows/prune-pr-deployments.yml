name: Prune Stale PR Deployments

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: prune-stale-pr-deployments

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  prune:
    name: Remove stale PR previews
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Prune stale PR stages
        run: >-
          pnpm dlx sst-stage-prune@1.0.2 cleanup-pr-stages
          --pkg-mgr pnpm
          --sst-script sst
          --pr-stage-pattern '^PR-[0-9]+$'
        env:
          GH_TOKEN: ${{ github.token }}
